<!doctype html>
<html lang="en" translate="no">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
  <!-- Suppresses Chrome's "Translate this page?" prompt — translate="no" plus
       this google-specific meta tag are the two signals Chrome's translate
       heuristic actually respects; lang="en" alone isn't enough to stop it
       from offering a translation when the browser's UI language differs. -->
  <meta name="google" content="notranslate" />

  <!-- @include src/app/meta/pwa-meta.html -->

  <!-- @include src/app/meta/ios-meta.html -->

  <!-- @include src/app/meta/ios-splash-screens.html -->

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; overflow: hidden; }
    #canvas { display: block; width: 100dvw; height: 100dvh; touch-action: none; }
  </style>
</head>

<body>
  <canvas id="canvas"></canvas>
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
