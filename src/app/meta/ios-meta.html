    <!-- iOS PWA meta -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!--
      black-translucent extends content behind the status bar (pairs with
      viewport-fit=cover + safe-area-inset env() in CSS for notch devices).
      Use "default" or "black" if you want an opaque bar with no bleed.
    -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Controls" />
