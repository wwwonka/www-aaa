<!-- ——— OPEN GRAPH ——— -->
<!-- og:type "video.game" est absent du protocole officiel OG.
     Utiliser "website" (page vitrine) ou "product" (page store) selon le contexte. -->
<meta property="og:type" content="website">
<meta property="og:title" content="[Nom du Jeu] — [Tagline courte]">
<meta property="og:description" content="[Pitch en 1-2 phrases. Inclure le genre et la plateforme.]">
<meta property="og:url" content="https://[tonsite].com/[slug-du-jeu]">
<meta property="og:site_name" content="[Nom du studio ou éditeur]">
<meta property="og:locale" content="fr_FR">

<!-- Image : key art ou screenshot cinématique du jeu.
     Ratio 1.91:1 (1200×630). Éviter le texte petit qui devient illisible en miniature.
     Le key art du jeu fonctionne mieux qu'un logo seul. -->
<meta property="og:image" content="https://[tonsite].com/images/[jeu]-og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="[Description visuelle : ex. 'Un chevalier face à un dragon dans une forêt sombre']">

<!-- Vidéo : trailer du jeu (optionnel mais très recommandé — les cartes vidéo
     génèrent beaucoup plus d'engagement sur Facebook/Twitter/Discord) -->
<meta property="og:video" content="https://[tonsite].com/videos/[jeu]-trailer.mp4">
<meta property="og:video:type" content="video/mp4">
<meta property="og:video:width" content="1920">
<meta property="og:video:height" content="1080">
